name: Node CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enforce Agent version policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            python3 scripts/check-agent-version-policy.py "origin/${{ github.base_ref }}"
          else
            python3 scripts/check-agent-version-policy.py
          fi
      - name: Verify mandatory Quota V2 live byte-budget workflow coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          source=Path(".github/workflows/quota-v2-byte-ceilings.yml").read_text()
          expected=(
              "Check injection tool and exact upstream pin",
              "Fetch exact reviewed upstream Xray and inject all experiment modules",
              "Verify exact shared user, Node and CDN limits before byte delivery",
              "Ensure all earlier WAL/fence/durable-meter regressions still pass",
              "Renew a signed permit twice on one live VLESS connection",
              "Real two-user stable VLESS ingress switches A without dropping B",
          )
          actual=tuple(re.findall(r"^      - name: (.+)",source,re.MULTILINE))
          assert actual==expected, ("missing/duplicated live Xray budget job",actual)
          required=(
              "name: Quota V2 experimental fsynced byte ceilings",
              "  pull_request:",
              "  measured-byte-budget:",
              "go test -race -count=1",
              "test_xray_live_signed_cap.py",
              "XMESH_QUOTA_V2_CROSS_NETNS=1",
              "test_xray_live_ingress_cutover.py",
              "python3 -m py_compile",
          )
          for item in required:
              assert item in source, ("missing required live budget coverage",item)
          assert "; then" not in source.splitlines(), "stray broken workflow shell fragment"
          tracked=subprocess.check_output(["git","ls-files"],text=True).splitlines()
          assert not any("__pycache__/" in name or name.endswith((".pyc",".pyo"))
                         for name in tracked), "generated bytecode tracked in release source"
          PY
      - name: Verify committed XSP-v2 staging artifact inventory
        run: bash scripts/check-xsp-v2-main-checkpoint.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: bash -n bootstrap.sh install.sh deploy/xmesh-xray-sync.sh deploy/xmesh-tls-renew-hook.sh deploy/install-xsp-v2-production-agent.sh
      - run: test "$(cat VERSION)" = "6.0.0"
      - run: test "$(cat AGENT_VERSION)" = "control-v6.0.38"
      - name: Strict-PQ fresh VPS installer must preserve activation recovery and root-only TLS preflight
        run: |
          python3 -m py_compile tests/test_strict_pq_v6_operational_install_release.py
          python3 tests/test_strict_pq_v6_operational_install_release.py -v
      - run: python3 -m py_compile deploy/xmesh-quota-revocation-marker.py deploy/xmesh-xray-update.py deploy/xmesh-policy-guard.py deploy/xmesh-policy-guard-base.py deploy/xmesh-profile-attest.py deploy/xmesh-hot-user-reconcile.py deploy/xmesh-tls-provision.py
      - run: python3 tests/test_tls_provision.py
      - run: python3 -m py_compile experiments/quota-v2-physical-stop/metered_tcp_egress.py tests/test_quota_v2_metered_tcp_egress.py
      - run: sudo env PYTHONDONTWRITEBYTECODE=1 python3 tests/test_quota_v2_metered_tcp_egress.py -v
      - run: python3 tests/test_quota_v2_xray_update_gate.py
      - run: python3 deploy/test-xmesh-policy-guard.py
      - run: python3 tests/test_v1_partial_ack_no_refill.py
      - run: python3 -m py_compile experiments/quota-v2-physical-stop/renewal_worker.py experiments/quota-v2-physical-stop/calendar_fence.py experiments/quota-v2-physical-stop/successor_meter.py experiments/quota-v2-physical-stop/successor_positive.py experiments/quota-v2-physical-stop/charge_worker.py tests/test_quota_v2_renewal_request_nonce.py tests/test_quota_v2_charge_worker.py
      - run: sudo python3 tests/test_quota_v2_renewal_request_nonce.py
      - run: python3 -m py_compile experiments/quota-v2-physical-stop/vless_ingress.py tests/test_quota_v2_vless_ingress.py
      - name: Per-user VLESS ingress rejects stale routes and preserves isolation
        run: sudo env XMESH_REQUIRE_REAL_UNIX=1 python3 tests/test_quota_v2_vless_ingress.py -v
      - name: Public TLS frontend cannot bypass the signed private metered ingress
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_frontend.py tests/test_quota_v2_public_tls_frontend.py
          python3 tests/test_quota_v2_public_tls_frontend.py -v
      - name: Root-owned public TLS lineage and certificate safety tests
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_certificates.py tests/test_quota_v2_public_tls_certificates.py
          sudo python3 tests/test_quota_v2_public_tls_certificates.py -v
      - name: Signed TLS revocation witness requires fresh nonce and pinned Nexus Ed25519 signature
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_revocation_watch.py tests/test_quota_v2_public_tls_revocation_watch.py
          python3 tests/test_quota_v2_public_tls_revocation_watch.py -v
      - name: Independent Linux pidfd deadman kills silent and orphaned TLS child processes
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_deadman.py tests/test_quota_v2_public_tls_deadman.py
          python3 tests/test_quota_v2_public_tls_deadman.py -v
      - name: Real PID1 watchdog contains frozen TLS supervisor and guardian
        run: |
          python3 -m py_compile tests/test_quota_v2_public_tls_systemd.py
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" XMESH_DISPOSABLE_TLS_SYSTEMD_TEST=1 python3 tests/test_quota_v2_public_tls_systemd.py -v
      - name: Signed TLS stop-only monitor cannot outlive expiry, revocation or Xray runtime
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_stop_monitor.py tests/test_quota_v2_public_tls_stop_monitor.py
          python3 tests/test_quota_v2_public_tls_stop_monitor.py -v
      - name: Full signed TLS user roster must match every live metered Xray cap
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_cap_watch.py tests/test_quota_v2_public_tls_cap_watch.py
          python3 tests/test_quota_v2_public_tls_cap_watch.py -v
      - name: Strict-PQ TLS candidate probe returns zero authority even when SQL evidence matches
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_preflight.py tests/test_quota_v2_public_tls_preflight.py
          python3 tests/test_quota_v2_public_tls_preflight.py -v
      - name: First-Genesis TLS WAL readback binds signed Nexus history to measured local ledger
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_wal_watch.py tests/test_quota_v2_public_tls_wal_watch.py
          python3 tests/test_quota_v2_public_tls_wal_watch.py -v
      - name: First-Genesis private route capsule pins original kernel meter and Go ingress path
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_route_mount.py experiments/quota-v2-physical-stop/public_tls_routes.py tests/test_quota_v2_public_tls_routes.py
          sudo env PATH="$PATH" python3 tests/test_quota_v2_public_tls_routes.py -v
      - name: Signed TLS input bundle joins actual sealed certificates and original read-only routes
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_pinned_inputs.py experiments/quota-v2-physical-stop/public_tls_spawn_preflight.py tests/test_quota_v2_public_tls_pinned_inputs.py
          sudo env PATH="$PATH" python3 tests/test_quota_v2_public_tls_pinned_inputs.py -v
      - name: Kernel child input proof requires exact inherited sealed FDs and original detached read-only route
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_child_inputs.py tests/test_quota_v2_public_tls_child_inputs.py
          sudo env PATH="$PATH" python3 tests/test_quota_v2_public_tls_child_inputs.py -v
      - name: Kernel executable seals bind the exact qualified original meter bytes to the owned exec inode
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/public_tls_executable.py tests/test_quota_v2_public_tls_executable.py
          sudo python3 tests/test_quota_v2_public_tls_executable.py -v
      - run: sudo python3 tests/test_quota_v2_charge_worker.py
      - run: bash -n bootstrap.sh deploy/install-v6-strict-operational-agents.sh deploy/install-metered-services.sh
      - run: python3 deploy/test-xmesh-policy-independent-credentials.py
      - run: python3 tests/test_hot_user_reconcile.py
      - run: python3 tests/test_user_meter.py
      - run: python3 tests/test_quota_v2_revocation_marker.py
      - run: python3 tests/test_quota_v2_quarantine_response.py
      - run: python3 -m py_compile experiments/quota-v2-physical-stop/quarantine_policy.py experiments/quota-v2-physical-stop/first_cap_handoff.py experiments/quota-v2-physical-stop/genesis_reservation.py experiments/quota-v2-physical-stop/cap_install.py tests/test_quota_v2_quarantine_handoff.py tests/test_quota_v2_first_cap_handoff.py tests/test_quota_v2_genesis_reservation.py
      - name: Real Ed25519 and measured two-phase strict-XSP2 quarantine handoff
        run: sudo python3 tests/test_quota_v2_quarantine_handoff.py -v
      - name: Real Ed25519 and signed staged-policy-to-Xray cap ownership negatives
        run: sudo python3 tests/test_quota_v2_first_cap_handoff.py -v
      - name: Verify Agent read-only local cap witness and measured Unix peer PID
        run: |
          python3 -m py_compile experiments/quota-v2-physical-stop/cap_install.py tests/test_quota_v2_cap_observation.py
          python3 tests/test_quota_v2_cap_observation.py -v
      - name: Strict fresh-Xray zero-WAL proof and no-authority marker regression
        run: sudo python3 tests/test_quota_v2_successor_meter.py -v
      - name: Strict-PQ zero-spend Genesis lease prepare/echo Ed25519 and root-state tests
        run: sudo python3 tests/test_quota_v2_genesis_reservation.py -v
      - run: python3 tests/test_quota_v2_reservation.py
      - run: python3 tests/test_quota_v2_verify_nexus_wal_anchor.py
      - run: python3 -m py_compile experiments/xray-dataplane-fence/runtime_identity.py experiments/quota-v2-physical-stop/wal_transport.py tests/test_quota_v2_measured_genesis.py tests/test_quota_v2_measured_genesis_docker.py
      - run: python3 tests/test_quota_v2_measured_genesis.py
      - name: Check installed WAL reconciliation against an isolated Xray container
        run: sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:?}" XMESH_DISPOSABLE_WAL_RUNTIME=1 bash tests/test_quota_wal_reconcile_runtime.sh
      - name: Verify zero-authority measured genesis on an actual isolated Xray container
        run: sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:?}" XMESH_DISPOSABLE_MEASURED_GENESIS=1 python3 tests/test_quota_v2_measured_genesis_docker.py
      - run: python3 tests/test_quota_v2_meter_continuity.py
      - run: python3 -m py_compile scripts/quota-v2-local-audit.py
      - run: python3 tests/test_quota_v2_local_audit.py
      - run: python3 tests/test_quota_v2_offline_policy_cutoff.py
      - run: python3 tests/test_quota_v2_prestop_capture.py
      - run: python3 tests/test_meter_scope_publish.py
      - name: Check out immutable previous production v6.0.11 meter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TriplexCorp/XMesh-Node
          ref: 647adcf7af326b205fce12545fb5d75a20bb8191
          path: .ci-previous-node
          persist-credentials: false
      - name: Prove old ledger survives 6.0.11 to 6.0.13 upgrade, outage and restart
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tests/test_meter_upgrade_continuity.py
          XMESH_PREVIOUS_NODE_DIR=.ci-previous-node python3 tests/test_meter_upgrade_continuity.py
      - run: python3 tests/test_bootstrap_meter.py
      - run: python3 tests/test_pending_enrollment.py
      - run: python3 tests/test_strict_pq_release_pin.py
      - run: sudo python3 tests/test_pq_install_guard.py
      - run: python3 tests/test_mixed_alpn_router.py
      - run: python3 tests/test_xray_router_reconcile.py
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: docker build --tag xmesh-node:ci .
      - run: docker run --rm -v "$PWD/config.example.json:/etc/xmesh-node/config.json:ro" xmesh-node:ci -check -config /etc/xmesh-node/config.json

  postquantum-v6:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_RELEASE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test strict-PQ product and activation runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_REVISION"
          test "$(cat VERSION)" = "6.0.0"
          cd agent/xspv2
          go test ./... -count=1
          # Private staged artifact and ownership tests must actually run as root.
          go test -c -o "$RUNNER_TEMP/xmesh-release-tests" ./cmd/xmesh-agent-xspv2-product
          sudo "$RUNNER_TEMP/xmesh-release-tests" -test.run '^Test(CollectReleaseArtifact|ReleaseTransferLockAndCrashCleanup|ReleaseVerifiedCandidateRetryDoesNotOverwriteOrRefetch|ImmutableReleasePreflightRejectsMutationAndSurvivesRetry|ReleasePreflightPreservesExistingSymlinkAndExpiredRecord|ReleaseCrashRecoveryAfterAtomicPublish|PreparedReleaseCrashRecoveryAfterPublish|StagedArtifactRequiresExactPrivateBytes)$' -test.v -test.count=1
      - name: Build exact reviewed Linux Agent candidate using production builder
        shell: bash
        run: |
          set -Eeuo pipefail
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$EXPECTED_RELEASE_REVISION"
          agent_version="$(tr -d '\r\n' < AGENT_VERSION)"
          [[ "$agent_version" =~ ^control-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          reviewed="$RUNNER_TEMP/xmesh-pq-reviewed-source"
          output="$RUNNER_TEMP/xmesh-pq-candidate"
          mkdir -m 0755 "$output"
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$reviewed"
          git -C "$reviewed" checkout --detach "$revision"
          test "$(git -C "$reviewed" rev-parse HEAD)" = "$revision"
          test -z "$(git -C "$reviewed" status --porcelain)"
          # Same root-owned checkout and Go builder as the normal installer
          # and independent installed two-Node identity reference.
          sudo chown -R 0:0 "$reviewed"
          docker run --rm -v "$reviewed:/src:ro" -v "$output:/out" \
            -w /src/agent/xspv2 golang:1.27.3-trixie \
            sh -ec "CGO_ENABLED=0 go build -trimpath -ldflags '-X main.version=$agent_version -X main.sourceRevision=$revision' -o /out/xmesh-agent-xspv2-activate ./cmd/xmesh-agent-xspv2-activate && CGO_ENABLED=0 go build -trimpath -ldflags '-X main.version=$agent_version -X main.sourceRevision=$revision' -o /out/xmesh-agent-xspv2-product ./cmd/xmesh-agent-xspv2-product"
          python3 - "$output" "$agent_version" "$revision" <<'PY'
          import hashlib
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path

          output, version, revision = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          assert platform.machine() == "x86_64", "unexpected release candidate architecture"
          artifacts = {}
          for name in ("xmesh-agent-xspv2-activate", "xmesh-agent-xspv2-product"):
              binary = output / name
              digest = hashlib.sha256(binary.read_bytes()).hexdigest()
              identity = json.loads(subprocess.check_output([binary, "--identity"], timeout=10))
              expected = {"version": version, "sourceRevision": revision, "artifactSha256": digest}
              assert identity == expected, (name, identity, expected)
              artifacts[name] = {"identity": identity, "sizeBytes": binary.stat().st_size}
          # Unsigned CI evidence is NOT a production release authorization.
          # A future promotion must bind these exact bytes in signed Nexus
          # enrollment/update authority and pass installed release tests.
          manifest = {
              "schema": "xmesh-agent-release-candidate-v1",
              "candidateOnly": True,
              "productionActivationAuthorized": False,
              "version": version,
              "sourceRevision": revision,
              "platform": "linux/amd64",
              "builder": "golang:1.27.3-trixie",
              "artifacts": artifacts,
          }
          (output / "candidate-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, sort_keys=True))
          PY
          cd "$output"
          sha256sum xmesh-agent-xspv2-activate xmesh-agent-xspv2-product candidate-manifest.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Retain exact reviewed candidate artifacts (not a production release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xmesh-pq-linux-amd64-candidate-${{ env.EXPECTED_RELEASE_REVISION }}
          path: ${{ runner.temp }}/xmesh-pq-candidate/
          if-no-files-found: error
          retention-days: 30
