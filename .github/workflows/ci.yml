name: Node CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: docker build --tag xmesh-node:ci .
      - run: docker run --rm -v "$PWD/config.example.json:/etc/xmesh-node/config.json:ro" xmesh-node:ci -check -config /etc/xmesh-node/config.json
