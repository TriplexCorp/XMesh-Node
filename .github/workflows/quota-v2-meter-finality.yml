name: Quota v2 Xray live meter finality experiment (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_quota_v2_xray_meter_finality.py'
      - '.github/workflows/quota-v2-meter-finality.yml'
  push:
    branches: [main]
    paths:
      - 'tests/test_quota_v2_xray_meter_finality.py'
      - '.github/workflows/quota-v2-meter-finality.yml'
permissions:
  contents: read
jobs:
  real-meter-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile deterministic Python fixture
        run: python3 -m py_compile tests/test_quota_v2_xray_meter_finality.py
      - name: Pull pinned published Xray
        run: docker pull ghcr.io/xtls/xray-core:26.10.31
      - name: Prove live counter can grow before physical stop and cannot be read after exit
        env:
          XMESH_DISPOSABLE_XRAY_METER_EXPERIMENT: "1"
        run: python3 tests/test_quota_v2_xray_meter_finality.py
