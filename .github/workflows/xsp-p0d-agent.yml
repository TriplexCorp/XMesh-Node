name: XSP-v2 P0-D Agent Artifact

on:
  push:
    branches: [main]
    paths:
      - "agent/xspv2/**"
      - "security/xspv2/poc-go/**"
      - ".github/workflows/xsp-p0d-agent.yml"
  pull_request:
    paths:
      - "agent/xspv2/**"
      - "security/xspv2/poc-go/**"
      - ".github/workflows/xsp-p0d-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Enforce isolated production-capable Agent boundary
        run: |
          set -euo pipefail
          test "$(sed -n 's/^go //p' go.mod)" = "1.23"
          grep -Fq 'go 1.27.3' agent/xspv2/go.mod
          grep -Fq '../../security/xspv2/poc-go' agent/xspv2/go.mod
          grep -Fq 'cutover.ExchangeSignedACKForReceipt' agent/xspv2/runtime/transport_linux.go
          grep -Fq 'cutover.RecoverSignedACKReceipt' agent/xspv2/runtime/transport_linux.go
          grep -Fq 'state.AttestAppliedRotation' agent/xspv2/runtime/transport_linux.go
          grep -Fq 'keyring.AttestAppliedRotation' agent/xspv2/state/durable_linux.go
          grep -Fq 'DefaultRoot = "/var/lib/xmesh-agent/xsp-v2"' agent/xspv2/state/state_linux.go
          grep -Fq 'node-request.vault' agent/xspv2/state/state_linux.go
          grep -Fq 'sourceRevision' agent/xspv2/cmd/xmesh-agent-xspv2/main.go
          grep -Fq 'invalid or unpinned embedded source revision' agent/xspv2/cmd/xmesh-agent-xspv2/main.go
          grep -Fq 'ReloadVerifiedPermitForReceiptRecovery' security/xspv2/poc-go/cutover/production_recovery_linux.go
          grep -Fq 'Agent artifact SHA-256 does not match executing binary' agent/xspv2/activation/execute_linux.go
          grep -Fq 'approval is outside its bounded validity window' agent/xspv2/activation/execute_linux.go
          grep -Fq 'approval transport policy weakened' agent/xspv2/activation/execute_linux.go

          grep -Fq 'request.Host = serverName' security/xspv2/poc-go/cutover/pq_only_ack_receipt_exchange_linux.go
          grep -Fq 'Proxy:              nil' security/xspv2/poc-go/cutover/pq_only_ack_receipt_exchange_linux.go
          grep -Fq 'XSP-v2 signed ACK redirection forbidden' security/xspv2/poc-go/cutover/pq_only_ack_receipt_exchange_linux.go
          grep -Fq 'DialStrictMutual(dialCtx, address, serverName' security/xspv2/poc-go/cutover/pq_only_ack_receipt_exchange_linux.go

          mapfile -d '' agent_prod_go < <(find agent/xspv2 -type f -name '*.go' ! -name '*_test.go' -print0)
          if grep -nE '"XMESH1|tls\.VersionTLS12|InsecureSkipVerify[[:space:]]*:[[:space:]]*true|"strict-pq=on|"allow.?weak' "${agent_prod_go[@]}"; then
            echo 'forbidden executable downgrade/fallback pattern in P0-D Agent Go source' >&2
            exit 1
          fi
          if grep -nE '"os/exec"|exec\.Command|"/bin/sh"|"bash"' "${agent_prod_go[@]}"; then
            echo 'forbidden shell/command execution pattern in P0-D Agent Go source' >&2
            exit 1
          fi
      - name: Test and build Go 1.27 Agent artifacts
        working-directory: agent/xspv2
        env:
          BUILD_VERSION: p0d2-ci
          ACTIVATION_VERSION: strict-pq-ci
        run: |
          set -euo pipefail
          rm -f /tmp/xsp-gofmt.diff
          (gofmt -d . | tee /tmp/xsp-gofmt.diff) || true

          # Compile/test even when formatting drift exists so security CI never
          # hides a real parser/type/test failure behind whitespace diagnostics.
          go test ./...
          go vet ./...

          go build -trimpath -o /tmp/xmesh-agent-xspv2-unpinned ./cmd/xmesh-agent-xspv2
          if /tmp/xmesh-agent-xspv2-unpinned --identity >/tmp/unpinned-identity.json 2>/tmp/unpinned-identity.err; then
            echo 'unpinned Agent build unexpectedly exposed a release identity' >&2
            exit 1
          fi
          grep -Fq 'invalid or unpinned embedded source revision' /tmp/unpinned-identity.err

          go build -trimpath -o /tmp/xmesh-agent-xspv2-activate-unpinned ./cmd/xmesh-agent-xspv2-activate
          if /tmp/xmesh-agent-xspv2-activate-unpinned --identity >/tmp/unpinned-activate.json 2>/tmp/unpinned-activate.err; then
            echo 'unpinned activation build unexpectedly exposed a release identity' >&2
            exit 1
          fi
          grep -Fq 'activation binary has no approved source revision' /tmp/unpinned-activate.err

          test "${#GITHUB_SHA}" = 40
          go build -trimpath \
            -ldflags "-X main.version=$BUILD_VERSION -X main.sourceRevision=$GITHUB_SHA" \
            -o /tmp/xmesh-agent-xspv2 ./cmd/xmesh-agent-xspv2
          /tmp/xmesh-agent-xspv2 --version | grep -Fxq "$BUILD_VERSION"
          /tmp/xmesh-agent-xspv2 --identity > /tmp/xsp-identity.json
          python3 - <<'PY'
          import json, os, re
          with open('/tmp/xsp-identity.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d == {'version': os.environ['BUILD_VERSION'], 'sourceRevision': os.environ['GITHUB_SHA']}
          assert re.fullmatch(r'[0-9a-f]{40}', d['sourceRevision'])
          PY

          go build -trimpath \
            -ldflags "-X main.version=$ACTIVATION_VERSION -X main.sourceRevision=$GITHUB_SHA" \
            -o /tmp/xmesh-agent-xspv2-activate ./cmd/xmesh-agent-xspv2-activate
          /tmp/xmesh-agent-xspv2-activate --identity > /tmp/xsp-activation-identity.json
          python3 - <<'PY'
          import hashlib,json,os,re
          binary='/tmp/xmesh-agent-xspv2-activate'
          with open(binary,'rb') as f:
              digest=hashlib.sha256(f.read()).hexdigest()
          with open('/tmp/xsp-activation-identity.json',encoding='utf-8') as f:
              d=json.load(f)
          assert d['version']==os.environ['ACTIVATION_VERSION']
          assert d['sourceRevision']==os.environ['GITHUB_SHA']
          assert d['artifactSha256']==digest
          assert re.fullmatch(r'[0-9a-f]{64}',digest)
          print('activationArtifactSha256='+digest)
          PY

          state="$(mktemp -d)/state"
          /tmp/xmesh-agent-xspv2 --check-state "$state" > /tmp/xsp-state.json
          test "$(stat -c '%a' "$state")" = 700
          test "$(stat -c '%a' "$state/cutover")" = 700
          test "$(stat -c '%a' "$state/keys")" = 700
          test ! -e "$state/keys/node-request.master"
          test ! -e "$state/keys/node-request.vault"
          python3 - <<'PY'
          import json, os
          with open('/tmp/xsp-state.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d['version']==os.environ['BUILD_VERSION']
          assert d['journal'].endswith('/cutover')
          PY

          if [[ -s /tmp/xsp-gofmt.diff ]]; then
            echo 'gofmt changes are required in Agent source' >&2
            exit 1
          fi
