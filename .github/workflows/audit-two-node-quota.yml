name: Audit - two-node offline quota model
on:
  pull_request:
    paths:
      - 'tests/test_two_node_quota_model.py'
      - 'deploy/xmesh-policy-guard-base.py'
      - '.github/workflows/audit-two-node-quota.yml'
permissions:
  contents: read
jobs:
  quota-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tests/test_two_node_quota_model.py
