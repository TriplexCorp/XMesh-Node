name: Xray 26.10.31 patched per-user session fence (disposable)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/xray-dataplane-fence/**'
      - 'experiments/quota-v2-physical-stop/cap_install.py'
      - '.github/workflows/xray-dataplane-fence-experiment.yml'
  push:
    # Test sensitive Xray changes on every pushed branch, even when a PR
    # created by an automation token does not emit a pull_request workflow.
    branches: ['**']
    paths:
      - 'experiments/xray-dataplane-fence/**'
      - 'experiments/quota-v2-physical-stop/cap_install.py'
      - '.github/workflows/xray-dataplane-fence-experiment.yml'
permissions:
  contents: read
jobs:
  patched-real-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Validate experimental fixture syntax
        run: |
          python3 -m py_compile experiments/xray-dataplane-fence/apply-experiment.py
          python3 -m py_compile experiments/xray-dataplane-fence/test_xray_patched_fence.py
          python3 -m py_compile experiments/xray-dataplane-fence/test_xray_patched_udp.py
          python3 -m py_compile experiments/xray-dataplane-fence/test_xray_patched_crash.py
      - name: Prove immutable Node-signed nonterminal evidence fails closed
        run: |
          python3 -m py_compile experiments/xray-dataplane-fence/meter_floor.py experiments/xray-dataplane-fence/test_meter_floor.py experiments/xray-dataplane-fence/runtime_identity.py experiments/xray-dataplane-fence/sign_observation.py experiments/xray-dataplane-fence/test_signed_nonfinal_observation.py experiments/xray-dataplane-fence/test_runtime_identity_docker.py
          python3 experiments/xray-dataplane-fence/test_meter_floor.py
          python3 experiments/xray-dataplane-fence/test_runtime_identity_docker.py
          python3 experiments/xray-dataplane-fence/test_signed_nonfinal_observation.py
      - name: Checkout EXACT official Xray v26.10.31 commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/XTLS/Xray-core.git .experimental-xray
          git -C .experimental-xray fetch --no-tags --depth=1 origin a4a3dff5b20c2faae567b742c172c7b95e75c083
          git -C .experimental-xray checkout --detach a4a3dff5b20c2faae567b742c172c7b95e75c083
          test "$(git -C .experimental-xray rev-parse HEAD)" = a4a3dff5b20c2faae567b742c172c7b95e75c083
      - name: Patch disposable Xray dispatcher and inbound lifecycle
        run: python3 experiments/xray-dataplane-fence/apply-experiment.py .experimental-xray
      - name: Race-test injected Xray module and build real Xray binary
        run: |
          cd .experimental-xray
          go test -race ./app/xmeshdrain
          # Validate fsync-before-mutation WAL, crash-visible conservative
          # precharges, exact inbound/direction hashes and replay gaps.
          go test -race ./app/xmeshdrain -run 'TestMeterFsync|TestOldRuntimeWAL|TestConcurrentAuthenticatedWrites|TestMeterLedgerGap|TestUncertainValidWAL' -count=3
          # Two old runtime incarnations and both main+CDN aliases must
          # never reopen with a fresh zero StatsService. A genuinely unused
          # third user must still remain available after old-PID SIGKILL.
          go test -race ./app/xmeshdrain -run 'TestUnreconciledOldRun|TestHistoricWAL' -count=12
          # Deletion of a previously fsynced old-process WAL is not the
          # same as a zero byte reading. Both a lost file and its missing
          # independent birth entry are permanent fail-closed incidents.
          go test -race ./app/xmeshdrain -run 'TestInventory|TestMultipleHistoricWAL' -count=12
          # A real audited StatsService may not accept out-of-origin raw
          # byte increments or overflow, even with another inbound active.
          go test -race ./app/xmeshdrain -run 'TestRawUserByteAdd|TestTrackedExactAlias|TestRawCounterOverflow' -count=15
          # Stress the revoked-read delivery gate with the race detector.
          go test -race ./app/xmeshdrain -run 'TestMeterRead' -count=15
          # The async timeout-reader probe exercises exact pinned common/buf.
          # Run concurrent-timeout / late-delivery races repeatedly.
          go test -race ./common/buf ./app/dispatcher -run TestExperimental -count=20
          # Real Linux TCP sockets with both peers splice-eligible: tracked
          # user bytes MUST go through trusted metered MultiBuffer writes,
          # while unrelated routes keep upstream raw TCP fast-path.
          go test -race ./proxy -run TestExperimentalSplice -count=20
          go test -race ./proxy -run TestExperimentalNonScopedTCP -count=20
          env GOFLAGS= GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 \
            go build -trimpath -o /tmp/xmesh-xray-fence-experiment ./main
          /tmp/xmesh-xray-fence-experiment version
      - name: Install a signed 8 MiB cap in real Xray and enforce it over VLESS
        env:
          XMESH_DISPOSABLE_XRAY_PATCH_EXPERIMENT: "1"
        run: python3 experiments/xray-dataplane-fence/test_xray_live_signed_cap.py /tmp/xmesh-xray-fence-experiment
      - name: Verify selective active VLESS stream termination while other users continue
        env:
          XMESH_DISPOSABLE_XRAY_PATCH_EXPERIMENT: "1"
        run: python3 experiments/xray-dataplane-fence/test_xray_patched_fence.py /tmp/xmesh-xray-fence-experiment
      - name: Verify VLESS UDP and XUDP user fencing on real Xray
        env:
          XMESH_DISPOSABLE_XRAY_PATCH_EXPERIMENT: "1"
        run: python3 experiments/xray-dataplane-fence/test_xray_patched_udp.py /tmp/xmesh-xray-fence-experiment
      - name: Verify SIGKILL durability, denied-user restart, and corrupt fence fail-closed
        env:
          XMESH_DISPOSABLE_XRAY_PATCH_EXPERIMENT: "1"
        run: python3 experiments/xray-dataplane-fence/test_xray_patched_crash.py /tmp/xmesh-xray-fence-experiment

      - name: Independently reproduce the exact tested metered Xray candidate
        env:
          REVIEWED_XRAY_REVISION: a4a3dff5b20c2faae567b742c172c7b95e75c083
          EXPECTED_NODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A PR workflow must check out the exact reviewed head, not the
          # synthetic merge commit. No artifact is qualified otherwise.
          test "$(git rev-parse HEAD)" = "$EXPECTED_NODE_REVISION"
          second="$RUNNER_TEMP/xray-rebuild-source"
          git -C .experimental-xray worktree add --detach "$second" "$REVIEWED_XRAY_REVISION"
          test "$(git -C "$second" rev-parse HEAD)" = "$REVIEWED_XRAY_REVISION"
          python3 experiments/xray-dataplane-fence/apply-experiment.py "$second"
          (
            cd "$second"
            env GOFLAGS= GOTOOLCHAIN=local GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 \
              GOCACHE="$RUNNER_TEMP/xray-rebuild-cache" \
              go build -trimpath -o "$RUNNER_TEMP/xray-rebuilt" ./main
          )
          cmp /tmp/xmesh-xray-fence-experiment "$RUNNER_TEMP/xray-rebuilt"
          out="$RUNNER_TEMP/metered-xray-candidate"
          mkdir -m 0700 "$out"
          install -m 0755 /tmp/xmesh-xray-fence-experiment "$out/xray"
          python3 - "$out" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          output = Path(sys.argv[1])
          binary = output / "xray"
          manifest = {
              "schemaVersion": 1,
              "kind": "xmesh.metered-xray-candidate",
              "nodeSourceRevision": os.environ["EXPECTED_NODE_REVISION"],
              "upstreamSourceRevision": os.environ["REVIEWED_XRAY_REVISION"],
              "goVersion": subprocess.check_output(["go", "version"], text=True).strip(),
              "buildFlags": ["GOOS=linux", "GOARCH=amd64", "GOAMD64=v1", "CGO_ENABLED=0", "-trimpath"],
              "artifactSha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "independentRebuildMatched": True,
              "candidateOnly": True,
              "productionActivationAuthorized": False,
          }
          (output / "candidate-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True, indent=2))
          PY
          (cd "$out" && sha256sum xray candidate-manifest.json > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Retain reproducible tested metered Xray candidate (not production approval)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metered-xray-linux-amd64-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/metered-xray-candidate/
          if-no-files-found: error
          retention-days: 14


  attest-main-candidate:
    name: Verify signed main-branch candidate provenance
    needs: patched-real-xray
    if: github.repository == 'TriplexCorp/XMesh-Node' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Retrieve the immutable candidate from the successful build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: metered-xray-linux-amd64-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/metered-xray-candidate
      - name: Verify candidate-only manifest and measured binary
        working-directory: ${{ runner.temp }}/metered-xray-candidate
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("candidate-manifest.json").read_bytes())
          assert manifest["schemaVersion"] == 1
          assert manifest["kind"] == "xmesh.metered-xray-candidate"
          assert manifest["nodeSourceRevision"] == os.environ["GITHUB_SHA"]
          assert manifest["independentRebuildMatched"] is True
          assert manifest["candidateOnly"] is True
          assert manifest["productionActivationAuthorized"] is False
          with Path("xray").open("rb") as binary:
              assert hashlib.file_digest(binary, "sha256").hexdigest() == manifest["artifactSha256"]
          PYTHON
      - name: Attest the independently rebuilt binary and candidate manifest
        id: provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ runner.temp }}/metered-xray-candidate/xray
            ${{ runner.temp }}/metered-xray-candidate/candidate-manifest.json
      - name: Require trusted GitHub issuer, signer workflow, ref and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        working-directory: ${{ runner.temp }}/metered-xray-candidate
        run: |
          set -euo pipefail
          for subject in xray candidate-manifest.json; do
            gh attestation verify "$subject" --bundle "$PROVENANCE_BUNDLE" \
              --repo TriplexCorp/XMesh-Node \
              --signer-workflow TriplexCorp/XMesh-Node/.github/workflows/xray-dataplane-fence-experiment.yml \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Retain verified signed candidate provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metered-xray-linux-amd64-provenance-${{ github.sha }}
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
