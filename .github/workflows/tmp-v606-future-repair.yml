name: Temporary v6.0.6 future repair
'on':
  push:
    branches:
      - fix/agent-v6.0.6-future-repair
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-v6.0.6-future-repair
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/tmp-v606-future-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENT_VERSION agent/xspv2/cmd/xmesh-agent-xspv2-activate/identity_version_test.go agent/xspv2/cmd/xmesh-agent-xspv2-product/identity_version_test.go deploy/install-v6-strict-operational-agents.sh deploy/install-xsp-v2-product-client.sh docs/AGENT_RELEASE_POLICY.md scripts/check-agent-version-policy.py
          if git diff --cached --quiet; then
            echo 'No non-workflow codemod changes left.'
            exit 0
          fi
          git commit -m 'chore: apply v6.0.6 future repair'
          git push origin HEAD:fix/agent-v6.0.6-future-repair
