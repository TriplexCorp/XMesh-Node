name: Quota V2 verified metered Xray installation (disposable)
on:
  pull_request:
    paths:
      - '.github/workflows/quota-v2-metered-bootstrap.yml'
      - 'deploy/install-metered-xray.sh'
      - 'deploy/install-metered-services.sh'
      - 'bootstrap.sh'
      - 'deploy/xmesh-pq-install-guard.sh'
      - 'deploy/install-v6-strict-operational-agents.sh'
      - 'experiments/xray-dataplane-fence/**'
      - 'experiments/quota-v2-physical-stop/qualified_runtime_image.py'
      - 'experiments/quota-v2-physical-stop/qualified_first_meter.py'
      - 'experiments/quota-v2-physical-stop/wal_transport.py'
      - 'experiments/quota-v2-physical-stop/successor_meter.py'
      - 'tests/test_quota_v2_successor_meter.py'
      - 'tests/test_quota_v2_qualified_runtime_image.py'
permissions:
  contents: read
jobs:
  reconstruct-and-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the reconstructed artifact only after verifying both signed subjects
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          target=/usr/local/libexec/xmesh-metered-xray
          nexus=5ee2543bc0f1a2a14d44d69ad3c3fad5fb40ebdb
          test ! -e "$target"
          approved_tree=27b8535d80514d6c9775df46ffb286cbf7884a9f
          if [[ "$(git rev-parse HEAD:experiments/xray-dataplane-fence)" != "$approved_tree" ]]; then
            # A new patch has no existing release approval. Prove the
            # current installer refuses it before exercising the approved
            # release's positive reconstruction in a separate checkout.
            if sudo bash deploy/install-metered-xray.sh "$nexus"; then
              echo 'Unqualified new patch unexpectedly installed.' >&2
              exit 1
            fi
            test ! -e "$target"
            sudo test ! -e /var/lib/xmesh-metered-xray
            approved_node=efca0dea82cc9ac347feb94790c83b82174a70e3
            git fetch --no-tags --depth=1 origin "$approved_node"
            git worktree add --detach "$RUNNER_TEMP/approved-metered-node" "$approved_node"
            cd "$RUNNER_TEMP/approved-metered-node"
            test "$(git rev-parse HEAD:experiments/xray-dataplane-fence)" = "$approved_tree"
          fi
          sudo bash deploy/install-metered-xray.sh "$nexus"
          [[ "$(stat -c '%u:%a:%h' "$target")" == '0:755:1' ]]
          if sudo bash install.sh; then
            echo 'Legacy standalone installer accepted a metered artifact.' >&2
            exit 1
          else
            [[ "$?" == 2 ]]
          fi
          printf '%s  %s\n' 28117fb4b4a749dab7c264d27b608cba0a8865ded1bb4766d9c4d5434a1e4d11 "$target" | sha256sum --check
          qualification=/var/lib/xmesh-metered-xray/identity
          [[ "$(sudo stat -c '%u:%a:%h' "$qualification")" == 0:600:1 ]]
          [[ "$(sudo stat -c '%u:%a' "$(dirname "$qualification")")" == 0:700 ]]
          if test -r "$qualification"; then
            echo 'Unprivileged runner can read the private qualification record.' >&2
            exit 1
          fi
          sudo grep -Fxq "artifactSha256=28117fb4b4a749dab7c264d27b608cba0a8865ded1bb4766d9c4d5434a1e4d11" "$qualification"
          sudo mv "$target" "$target.saved"
          if sudo bash install.sh; then
            echo 'Legacy installation accepted after metered executable loss.' >&2
            exit 1
          else
            [[ "$?" == 2 ]]
          fi
          sudo mv "$target.saved" "$target"
          sudo python3 "$GITHUB_WORKSPACE"/tests/test_quota_v2_qualified_runtime_image.py
          report="$(sudo python3 "$GITHUB_WORKSPACE"/experiments/quota-v2-physical-stop/qualified_runtime_image.py)"
          IMAGE_REPORT="$report" python3 -c 'import json,os,re; r=json.loads(os.environ["IMAGE_REPORT"]); assert re.fullmatch(r"sha256:[0-9a-f]{64}",r["imageId"]); assert r["artifactSha256"]=="28117fb4b4a749dab7c264d27b608cba0a8865ded1bb4766d9c4d5434a1e4d11"; assert r["productionActivationAuthorized"] is False'
          test -z "$(sudo docker ps -q --filter ancestor="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["imageId"])' "$report")")"
          sudo python3 - "$GITHUB_WORKSPACE" "$report" <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path(sys.argv[1]) / "experiments/quota-v2-physical-stop"))
          import qualified_first_meter as meter
          image = json.loads(sys.argv[2])
          profile = {"stats": {}, "api": {"tag": "xmesh_stats_api", "listen": "127.0.0.1:10085", "services": ["StatsService"]},
                     "policy": {"levels": {"0": {"statsUserUplink": True, "statsUserDownlink": True}}},
                     "inbounds": [{"tag": "vless-main", "listen": "127.0.0.1",
                                   "protocol": "vless", "port": 28401,
                                   "settings": {"decryption": "none", "clients": [{"id": "00000000-0000-4000-8000-000000000001", "email": "xmesh-u1--vless-main"}]}}],
                     "outbounds": [{"protocol": "blackhole"}]}
          meter.launch_meter(image["imageId"], profile, 1, "a" * 64, "b" * 64)
          config = hashlib.sha256(meter.wal.observed.canonical(profile)).hexdigest()
          os.environ["XMESH_QUOTA_V2_AGENT_MODE"] = "installed"
          try:
              pins = (image["artifactSha256"], config)
              live = meter.wal._measure_quarantined_runtime(pins)
              assert len(live[3]) == 64
              for bad in (None, ("0" * 64, config), (pins[0], "0" * 64)):
                  try:
                      meter.wal._measure_quarantined_runtime(bad)
                  except (ValueError, OSError):
                      pass
                  else:
                      raise AssertionError("installed meter accepted absent or wrong runtime pins")
              assert meter.wal._measure_quarantined_runtime(pins) == live
          finally:
              meter.release.docker("rm", "--force", "xmesh-managed-xray")
          PYTHON
          inode="$(stat -c '%i' "$target")"
          sudo bash deploy/install-metered-xray.sh "$nexus"
          [[ "$(stat -c '%i' "$target")" == "$inode" ]]
          sudo sh -c 'printf invalid >> "$1"' sh "$target"
          before="$(sha256sum "$target")"
          if sudo bash deploy/install-metered-xray.sh "$nexus"; then
            echo 'Unexpected success for a modified installed artifact.' >&2
            exit 1
          fi
          [[ "$(sha256sum "$target")" == "$before" ]]

      - name: Diagnose isolated meter startup on the disposable runner
        if: failure()
        run: |
          sudo docker inspect --format 'state={{json .State}} net={{json .HostConfig.NetworkMode}} restart={{json .HostConfig.RestartPolicy}} bindings={{json .HostConfig.PortBindings}} ports={{json .NetworkSettings.Ports}} networks={{json .NetworkSettings.Networks}}' xmesh-managed-xray
          sudo docker logs --tail 80 xmesh-managed-xray
