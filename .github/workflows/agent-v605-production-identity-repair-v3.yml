name: Agent v6.0.5 production identity repair v3

on:
  push:
    branches:
      - fix/agent-v6.0.5-production-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-v6.0.5-production-identity
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Apply runtime and installer repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {text.count(old)}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          Path('AGENT_VERSION').write_text('control-v6.0.5\n',encoding='utf-8')
          replace_once('docs/AGENT_RELEASE_POLICY.md','Current target: **`control-v6.0.4`**.','Current target: **`control-v6.0.5`**.')

          helper='''func validProductionVersion(value string) bool {\n\tconst prefix = "control-v6."\n\tif !strings.HasPrefix(value, prefix) {\n\t\treturn false\n\t}\n\tparts := strings.Split(strings.TrimPrefix(value, prefix), ".")\n\tif len(parts) != 2 {\n\t\treturn false\n\t}\n\tfor _, part := range parts {\n\t\tif part == "" || (len(part) > 1 && part[0] == '0') {\n\t\t\treturn false\n\t\t}\n\t\tfor _, ch := range part {\n\t\t\tif ch < '0' || ch > '9' {\n\t\t\t\treturn false\n\t\t\t}\n\t\t}\n\t}\n\treturn true\n}\n\n'''

          product='agent/xspv2/cmd/xmesh-agent-xspv2-product/main.go'
          replace_once(product,'func identity() (releaseIdentity, error) {',helper+'func identity() (releaseIdentity, error) {')
          replace_once(product,'if version != "control-v6.0.0" || len(sourceRevision) != 40 || len(digest) != 64 {','if !validProductionVersion(version) || len(sourceRevision) != 40 || len(digest) != 64 {')

          activate='agent/xspv2/cmd/xmesh-agent-xspv2-activate/main.go'
          replace_once(activate,'func validRevision(value string) bool {',helper+'func validRevision(value string) bool {')
          replace_once(activate,'\tif !validRevision(sourceRevision) {\n\t\tfmt.Fprintln(os.Stderr, "activation binary has no approved source revision")','\tif !validProductionVersion(version) {\n\t\tfmt.Fprintln(os.Stderr, "activation binary has no approved production version")\n\t\tos.Exit(2)\n\t}\n\tif !validRevision(sourceRevision) {\n\t\tfmt.Fprintln(os.Stderr, "activation binary has no approved source revision")')

          product_installer='deploy/install-xsp-v2-product-client.sh'
          replace_once(product_installer,'PRODUCT_VERSION="control-v6.0.0"','AGENT_VERSION_FILE="$ROOT/AGENT_VERSION"\n[[ -f "$AGENT_VERSION_FILE" && ! -L "$AGENT_VERSION_FILE" ]] || { echo "AGENT_VERSION file missing" >&2; exit 1; }\nPRODUCT_VERSION="$(tr -d \'\\r\\n\' < "$AGENT_VERSION_FILE")"\n[[ "$PRODUCT_VERSION" =~ ^control-v6\\.[0-9]+\\.[0-9]+$ ]] || { echo "Invalid Agent release version: $PRODUCT_VERSION" >&2; exit 1; }')
          replace_once(product_installer,'BUILD_DIR="$(mktemp -d /tmp/xmesh-pq-product.XXXXXXXX)"\ntrap \'rm -rf "$BUILD_DIR"\' EXIT','TEMP_ROOT="${TMPDIR:-/tmp}"\n[[ "$TEMP_ROOT" == /* && -d "$TEMP_ROOT" && ! -L "$TEMP_ROOT" && -w "$TEMP_ROOT" ]] || { echo "Writable absolute TMPDIR required for PQ product build: $TEMP_ROOT" >&2; exit 1; }\nBUILD_DIR="$(mktemp -d "$TEMP_ROOT/xmesh-pq-product.XXXXXXXX")"\nPRODUCT_STAGE="/usr/local/bin/.xmesh-agent-xspv2-product.v6.new"\ncleanup() { rm -rf "$BUILD_DIR"; rm -f "$PRODUCT_STAGE"; }\ntrap cleanup EXIT')
          replace_once(product_installer,'IDENTITY="$(timeout 10 "$BINARY" --identity)"','install -d -o root -g root -m 0755 /usr/local/bin\ninstall -o root -g root -m 0755 "$BINARY" "$PRODUCT_STAGE"\n[[ "$(sha256sum "$PRODUCT_STAGE" | awk \'{print $1}\')" == "$DIGEST" ]] || { echo "Staged strict-PQ product client digest mismatch" >&2; exit 1; }\nIDENTITY="$(timeout 10 "$PRODUCT_STAGE" --identity)"')
          replace_once(product_installer,'install -d -o root -g root -m 0755 /usr/local/bin\ninstall -o root -g root -m 0755 "$BINARY" /usr/local/bin/.xmesh-agent-xspv2-product.v6.new\nmv -f /usr/local/bin/.xmesh-agent-xspv2-product.v6.new /usr/local/bin/xmesh-agent-xspv2-product','mv -f "$PRODUCT_STAGE" /usr/local/bin/xmesh-agent-xspv2-product')

          operational='deploy/install-v6-strict-operational-agents.sh'
          replace_once(operational,'[[ "$(tr -d \'\\r\\n\' < "$ROOT/VERSION")" == "6.0.0" ]] || { echo "XMesh Node v6.0.0 required" >&2; exit 1; }\nPRODUCT=/usr/local/bin/xmesh-agent-xspv2-product','[[ "$(tr -d \'\\r\\n\' < "$ROOT/VERSION")" == "6.0.0" ]] || { echo "XMesh Node v6.0.0 required" >&2; exit 1; }\nAGENT_VERSION_FILE="$ROOT/AGENT_VERSION"\n[[ -f "$AGENT_VERSION_FILE" && ! -L "$AGENT_VERSION_FILE" ]] || { echo "AGENT_VERSION file missing" >&2; exit 1; }\nAGENT_VERSION="$(tr -d \'\\r\\n\' < "$AGENT_VERSION_FILE")"\n[[ "$AGENT_VERSION" =~ ^control-v6\\.[0-9]+\\.[0-9]+$ ]] || { echo "Invalid Agent release version: $AGENT_VERSION" >&2; exit 1; }\nPRODUCT=/usr/local/bin/xmesh-agent-xspv2-product')
          replace_once(operational,"grep -Fq 'AGENT_VERSION=\"control-v6.0.0\"' /usr/local/sbin/xmesh-node-control || { echo \"invalid control worker\" >&2; exit 1; }","grep -Fq \"AGENT_VERSION=\\\"$AGENT_VERSION\\\"\" /usr/local/sbin/xmesh-node-control || { echo \"control worker version does not match canonical Agent release\" >&2; exit 1; }")

          policy='scripts/check-agent-version-policy.py'
          insert='''\nproduct = Path("agent/xspv2/cmd/xmesh-agent-xspv2-product/main.go").read_text(encoding="utf-8")\nif "!validProductionVersion(version)" not in product:\n    raise SystemExit("product runtime must validate canonical v6 production release versions")\n\nproduct_installer = Path("deploy/install-xsp-v2-product-client.sh").read_text(encoding="utf-8")\nif 'AGENT_VERSION_FILE="$ROOT/AGENT_VERSION"' not in product_installer or 'timeout 10 "$PRODUCT_STAGE" --identity' not in product_installer:\n    raise SystemExit("product installer must source canonical AGENT_VERSION and verify identity from executable staging")\n\noperational_installer = Path("deploy/install-v6-strict-operational-agents.sh").read_text(encoding="utf-8")\nif ('AGENT_VERSION_FILE="$ROOT/AGENT_VERSION"' not in operational_installer\n        or 'grep -Fq "AGENT_VERSION=' not in operational_installer\n        or '$AGENT_VERSION' not in operational_installer):\n    raise SystemExit("operational installer must require the canonical control-worker Agent version")\n'''
          replace_once(policy,'if len(sys.argv) > 1:\n',insert+'\nif len(sys.argv) > 1:\n')
          PY

          cat > agent/xspv2/cmd/xmesh-agent-xspv2-product/identity_version_test.go <<'EOF'
          package main

          import (
          	"strings"
          	"testing"
          )

          func TestIdentityAcceptsCurrentProductionPatch(t *testing.T) {
          	oldVersion, oldRevision := version, sourceRevision
          	defer func() { version, sourceRevision = oldVersion, oldRevision }()
          	version = "control-v6.0.5"
          	sourceRevision = strings.Repeat("a", 40)
          	got, err := identity()
          	if err != nil {
          		t.Fatalf("identity rejected current production patch: %v", err)
          	}
          	if got.Version != version || got.SourceRevision != sourceRevision || len(got.ArtifactSHA256) != 64 {
          		t.Fatalf("unexpected identity: %#v", got)
          	}
          }

          func TestProductionVersionRejectsNonReleaseIdentity(t *testing.T) {
          	for _, value := range []string{"dev", "strict-pq-unreleased", "control-v5.9.9", "control-v6.00.5", "control-v6.0.05", "control-v6.0"} {
          		if validProductionVersion(value) {
          			t.Fatalf("accepted non-production version %q", value)
          		}
          	}
          }
          EOF

          cat > agent/xspv2/cmd/xmesh-agent-xspv2-activate/identity_version_test.go <<'EOF'
          //go:build linux

          package main

          import "testing"

          func TestActivationProductionVersionValidation(t *testing.T) {
          	for _, value := range []string{"control-v6.0.0", "control-v6.0.5", "control-v6.12.3"} {
          		if !validProductionVersion(value) {
          			t.Fatalf("rejected production version %q", value)
          		}
          	}
          	for _, value := range []string{"strict-pq-unreleased", "control-v5.0.0", "control-v6.00.5", "control-v6.0.05"} {
          		if validProductionVersion(value) {
          			t.Fatalf("accepted invalid production version %q", value)
          		}
          	}
          }
          EOF

          gofmt -w agent/xspv2/cmd/xmesh-agent-xspv2-activate/main.go agent/xspv2/cmd/xmesh-agent-xspv2-activate/identity_version_test.go agent/xspv2/cmd/xmesh-agent-xspv2-product/main.go agent/xspv2/cmd/xmesh-agent-xspv2-product/identity_version_test.go
          bash -n deploy/install-xsp-v2-production-agent.sh deploy/install-xsp-v2-product-client.sh deploy/install-v6-strict-operational-agents.sh
          git fetch --no-tags origin main
          python3 scripts/check-agent-version-policy.py origin/main
          test "$(cat AGENT_VERSION)" = "control-v6.0.5"
          cd agent/xspv2
          go test ./... -count=1
          revision="$(git -C ../.. rev-parse HEAD)"
          agent_version="$(tr -d '\r\n' < ../../AGENT_VERSION)"
          go build -trimpath -ldflags "-X main.version=$agent_version -X main.sourceRevision=$revision" -o /tmp/xmesh-agent-xspv2-activate ./cmd/xmesh-agent-xspv2-activate
          go build -trimpath -ldflags "-X main.version=$agent_version -X main.sourceRevision=$revision" -o /tmp/xmesh-agent-xspv2-product ./cmd/xmesh-agent-xspv2-product
          /tmp/xmesh-agent-xspv2-activate --identity | grep -Fq '"version":"control-v6.0.5"'
          /tmp/xmesh-agent-xspv2-product --identity | grep -Fq '"version":"control-v6.0.5"'
          cd ../..
          git diff --check
      - name: Commit bounded runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-v605-production-identity-autopatch.yml .github/workflows/agent-v605-production-identity-repair-v2.yml .github/workflows/agent-v605-production-identity-repair-v3.yml
          git add -A
          git commit -m 'fix(agent): make v6 release identity patch-aware'
          git push origin HEAD:fix/agent-v6.0.5-production-identity
