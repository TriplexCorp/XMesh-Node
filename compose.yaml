services:
  xmesh-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: xmesh-node:local
    container_name: xmesh-node
    restart: unless-stopped
    # Host networking is intentional: 127.0.0.1 backends refer to services
    # on the VPS. Docker port mappings do not apply in this mode.
    network_mode: host
    user: "10001:10001"
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./config.json:/etc/xmesh-node/config.json:ro
    stop_grace_period: 20s
